<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Lesson - Sower Prep</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">
        <h1>Sower Prep</h1>

        <button id="backToDashboardButton">
            Back to Dashboard
        </button>
    </header>


    <main class="form-container">

        <h2>Create New Lesson</h2>

        <p>
            Choose a ministry and enter the lesson information.
        </p>


        <!-- Ministry Selection -->

        <section class="ministry-selection">

            <label for="ministry">
                Ministry
            </label>

            <select id="ministry" required>

                <option value="">
                    Select a ministry
                </option>

                <option value="Calvary Kids — 2–5">
                    🌈 Calvary Kids — 2–5
                </option>

                <option value="Calvary Kids — K–3">
                    🌈 Calvary Kids — K–3
                </option>

                <option value="The 45">
                    4️⃣5️⃣ The 45
                </option>

                <option value="King's Kids">
                    👑 King's Kids
                </option>

                <option value="Calvary Youth">
                    ⚡ Calvary Youth
                </option>

            </select>

        </section>


        <!-- Ministry-specific form will appear here -->

        <div id="ministryForm">

            <div class="empty-message">

                <p>
                    Please select a ministry above to begin.
                </p>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="script.js"></script>

</body>

</html>
