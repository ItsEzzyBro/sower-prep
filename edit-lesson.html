<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Lesson - Children's Ministry Teacher Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">

        <h1>Children's Ministry Teacher Assistant</h1>

        <button id="backToDashboardButton">
            Back to Dashboard
        </button>

    </header>


    <main class="form-container">

        <h2>Edit Lesson</h2>

        <p>
            Update your lesson information below.
        </p>


        <!-- The ministry will be displayed here -->

        <div id="editMinistryDisplay"></div>


        <!-- The lesson form will be created here -->

        <div id="ministryForm">

            <div class="empty-message">

                <p>
                    Loading lesson...
                </p>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="script.js"></script>

</body>

</html>
