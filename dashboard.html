<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Children's Ministry Teacher Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">

        <h1>Children's Ministry Teacher Assistant</h1>

        <button id="logoutButton">
            Logout
        </button>

    </header>


    <main class="dashboard-container">

        <section class="welcome-section">
            <h2 id="welcomeMessage">Welcome, Teacher! 👋</h2>
            <p>Ready to plant some seads?</p>
        </section>

        <section class="lesson-actions">

            <button id="createLessonButton">
                + Create New Lesson
            </button>

        </section>


        <section class="lessons-section">

            <h2>My Lessons</h2>

            <div id="lessonList">

                <p class="empty-message">
                    No lessons yet.
                    Create your first lesson to get started!
                </p>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>

</html>
